<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Local Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" hidden>
      <p>The window did not finish loading.</p>
      <button onclick="location.reload()">Reload</button>
    </div>
    <script>
      // Never leave a silent blank window: show a way out while the app has not
      // rendered yet, and hide it again as soon as it has.
      (function () {
        var started = Date.now();
        var check = setInterval(function () {
          var root = document.getElementById("root");
          var fallback = document.getElementById("boot-fallback");
          if (!root || !fallback) return;
          var mounted = root.childElementCount > 0;
          fallback.hidden = mounted || Date.now() - started < 5000;
          if (mounted) clearInterval(check);
        }, 500);
      })();
      window.addEventListener("keydown", function (e) {
        if (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r")) location.reload();
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
